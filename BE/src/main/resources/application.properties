spring.application.name=demo

spring.datasource.url=jdbc:postgresql://localhost:5432/Progetto-settimanale-U5W4D5
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

app.storage.root=./uploads

app.google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

app.ocr.datapath=/opt/homebrew/share/tessdata
app.ocr.language=ita+eng
# Cartella con libtesseract.dylib: Homebrew la mette qui, ma non e'
# nei percorsi di ricerca nativi di default (serve dirlo a JNA).
app.ocr.native-library-path=/opt/homebrew/lib
