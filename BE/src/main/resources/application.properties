spring.application.name=demo

# --- Database ---
# I valori sensibili si leggono da variabili d'ambiente. La sintassi
# ${NOME:default} usa il valore dopo i due punti se la variabile non
# esiste: qui il default e' volutamente assente per la password, cosi'
# l'applicazione non parte finche' non la si configura davvero.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Progetto-settimanale-U5W4D5}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Upload ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

app.storage.root=./uploads

# --- Geocoding ---
# Provider: "google" (Geocoding API v4, funziona con la chiave
# gratuita) oppure "nominatim" (OpenStreetMap, senza chiave).
app.geocoding.provider=${GEOCODING_PROVIDER:google}
# Nominatim blocca le richieste senza uno User-Agent identificabile.
app.geocoding.user-agent=ProgettoSettimanaleU5W4D5/1.0 (progetto didattico)

# Chiave della Geocoding API, usata solo dal backend e mai spedita al
# browser. Senza, il provider "google" non funziona.
app.google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# --- OCR ---
app.ocr.datapath=${OCR_DATAPATH:/opt/homebrew/share/tessdata}
app.ocr.language=${OCR_LANGUAGE:ita+eng}
# Cartella con libtesseract.dylib: Homebrew la mette qui, ma non e'
# nei percorsi di ricerca nativi di default (serve dirlo a JNA).
app.ocr.native-library-path=${OCR_NATIVE_PATH:/opt/homebrew/lib}
