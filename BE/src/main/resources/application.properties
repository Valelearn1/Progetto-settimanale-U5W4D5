spring.application.name=demo

spring.datasource.url=jdbc:postgresql://localhost:5432/Progetto-settimanale-U5W4D5
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

app.storage.root=./uploads

# Provider di geocoding: "google" (Geocoding API v4, funziona con la
# chiave gratuita) oppure "nominatim" (OpenStreetMap, senza chiave).
app.geocoding.provider=google
# Nominatim blocca le richieste senza uno User-Agent identificabile.
app.geocoding.user-agent=ProgettoSettimanaleU5W4D5/1.0 (progetto didattico)

app.google.maps.api-key=${GOOGLE_MAPS_API_KEY:AIzaSyDwvwvh-T376KlE6pbGC0PkKB2ANV3TH28}

# Chiave per firmare i token JWT: almeno 32 caratteri (256 bit) per
# l'algoritmo HS256. In un progetto vero starebbe solo in una
# variabile d'ambiente, mai scritta nel file.
app.jwt.secret=${JWT_SECRET:chiave-di-sviluppo-bacheca-da-cambiare-in-produzione-2026}
# Durata del token in millisecondi (24 ore)
app.jwt.expiration=86400000

app.ocr.datapath=/opt/homebrew/share/tessdata
app.ocr.language=ita+eng
# Cartella con libtesseract.dylib: Homebrew la mette qui, ma non e'
# nei percorsi di ricerca nativi di default (serve dirlo a JNA).
app.ocr.native-library-path=/opt/homebrew/lib
